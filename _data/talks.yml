# Conference talks. Same schema as publications.yml.
#
# Required : title, authors, venue, year
# Optional : pdf / arxiv / acm  - the three most common links, as plain URLs
#            image  - filename inside /imgs/ (defaults to icon.jpg)
#            page   - internal project page; makes the title a link
#            links  - anything that isn't pdf/arxiv/acm, as {label, url};
#                     omit `url` to show the label as plain, unlinked text
#            note   - award / trailing remark shown after the links
#
# - title: "An Example Paper"
#   authors: "A. Author, B. Author"
#   venue: "Some Conference"
#   year: 2026
#   pdf: "https://example.com/paper.pdf"
#   arxiv: "https://arxiv.org/abs/0000.00000"
#   acm: "https://dl.acm.org/doi/10.1145/0000000"
#   links:
#     - {label: "Code", url: "https://github.com/example"}
#   note: "Best Paper Award"

